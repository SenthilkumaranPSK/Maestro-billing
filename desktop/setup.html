<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <title>Maestro Billing — Connection Setup</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 22px 26px;
        font-family: "Segoe UI", system-ui, sans-serif;
        color: #1e293b;
        background: #f8fafc;
        font-size: 13px;
      }
      h1 { font-size: 16px; margin: 0 0 3px; }
      .sub { color: #64748b; margin: 0 0 16px; }
      .opt {
        display: block;
        border: 1.5px solid #e2e8f0;
        border-radius: 9px;
        padding: 11px 13px;
        margin-bottom: 9px;
        background: #fff;
        cursor: pointer;
      }
      .opt:hover { border-color: #cbd5e1; }
      .opt.sel { border-color: #15803d; background: #f0fdf4; }
      .opt input { margin-right: 8px; }
      .opt .t { font-weight: 600; }
      .opt .d { color: #64748b; margin: 3px 0 0 22px; line-height: 1.45; }
      .panel {
        margin: 0 0 9px 22px;
        padding: 11px 13px;
        border-left: 2px solid #bbf7d0;
        display: none;
      }
      .panel.show { display: block; }
      label.f { display: block; font-weight: 600; margin-bottom: 4px; }
      input[type="text"] {
        width: 100%;
        padding: 7px 9px;
        border: 1.5px solid #cbd5e1;
        border-radius: 6px;
        font-size: 13px;
        font-family: Consolas, monospace;
      }
      input[type="text"]:focus { outline: none; border-color: #15803d; }
      .hint { color: #64748b; margin-top: 5px; line-height: 1.5; }
      .ips {
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 6px;
        padding: 8px 10px;
        margin-top: 7px;
        font-family: Consolas, monospace;
        font-size: 13px;
      }
      .ips b { color: #15803d; font-size: 14px; }
      .chk { margin-top: 9px; display: flex; gap: 7px; align-items: flex-start; }
      .chk input { margin: 2px 0 0; }
      .err {
        color: #b91c1c;
        background: #fef2f2;
        border: 1px solid #fecaca;
        border-radius: 6px;
        padding: 7px 10px;
        margin-top: 9px;
        display: none;
      }
      .err.show { display: block; }
      .row { display: flex; gap: 9px; justify-content: flex-end; margin-top: 16px; }
      button {
        padding: 8px 17px;
        border-radius: 7px;
        border: 1.5px solid #cbd5e1;
        background: #fff;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        font-family: inherit;
      }
      button.primary { background: #15803d; border-color: #15803d; color: #fff; }
      button:hover { filter: brightness(0.97); }
    </style>
  </head>
  <body>
    <h1>How should this PC run?</h1>
    <p class="sub">You can change this later from this same screen.</p>

    <label class="opt" id="optServer">
      <input type="radio" name="mode" value="server" /><span class="t">This is the Main PC</span>
      <div class="d">
        Holds the database, runs the daily backups, and stays linked to WhatsApp. Choose this on
        one PC only.
      </div>
    </label>

    <div class="panel" id="panelServer">
      <div class="chk">
        <input type="checkbox" id="share" />
        <label for="share">
          <b>Let another PC on this Wi-Fi connect to this one</b>
          <div class="hint">
            Leave this off if only this PC will be used for billing. Only turn it on for a private
            studio network — anyone on the same Wi-Fi can reach the billing system while it's on.
          </div>
        </label>
      </div>
      <div id="ipBlock"></div>
    </div>

    <label class="opt" id="optClient">
      <input type="radio" name="mode" value="client" /><span class="t">Connect to the Main PC</span>
      <div class="d">
        Uses the Main PC's database over the network. Nothing is stored on this PC. The Main PC must
        be switched on to bill from here.
      </div>
    </label>

    <div class="panel" id="panelClient">
      <label class="f" for="addr">Address of the Main PC</label>
      <input type="text" id="addr" placeholder="192.168.1.50" spellcheck="false" />
      <div class="hint">
        On the Main PC, open this same screen and pick "This is the Main PC" — it shows the exact
        address to type here.
      </div>
    </div>

    <div class="err" id="err"></div>

    <div class="row">
      <button id="cancel">Quit</button>
      <button class="primary" id="save">Save &amp; Start</button>
    </div>

    <script>
      // Values are handed in on the query string by main.js — no IPC and no
      // Node access in this window (contextIsolation stays on, as everywhere
      // else in this app). main.js reads the answer back out of the promise
      // below via webContents.executeJavaScript.
      var q = new URLSearchParams(location.search);
      var ips = JSON.parse(q.get('ips') || '[]');
      var port = q.get('port') || '3179';
      var mode = q.get('mode') || '';
      var addr = q.get('address') || '';
      var share = q.get('share') === '1';
      var firstRun = q.get('firstRun') === '1';

      document.getElementById('cancel').textContent = firstRun ? 'Quit' : 'Cancel';

      document.getElementById('ipBlock').innerHTML = ips.length
        ? '<div class="hint" style="margin-top:9px">Type this on the other PC:</div><div class="ips">' +
          ips.map(function (i) { return '<b>' + i + ':' + port + '</b>'; }).join('<br />') +
          '</div>'
        : '<div class="hint" style="margin-top:9px">No network connection detected on this PC yet.</div>';

      var els = {
        server: document.getElementById('optServer'),
        client: document.getElementById('optClient'),
        pServer: document.getElementById('panelServer'),
        pClient: document.getElementById('panelClient'),
        err: document.getElementById('err'),
        addr: document.getElementById('addr'),
        share: document.getElementById('share'),
      };

      function paint() {
        var v = (document.querySelector('input[name=mode]:checked') || {}).value;
        els.server.classList.toggle('sel', v === 'server');
        els.client.classList.toggle('sel', v === 'client');
        els.pServer.classList.toggle('show', v === 'server');
        els.pClient.classList.toggle('show', v === 'client');
      }

      Array.prototype.forEach.call(document.querySelectorAll('input[name=mode]'), function (r) {
        r.addEventListener('change', paint);
      });

      els.addr.value = addr;
      els.share.checked = share;
      document.querySelector('input[value="' + (mode === 'client' ? 'client' : 'server') + '"]').checked = true;
      paint();

      var resolveResult;
      window.__setupResult = new Promise(function (r) { resolveResult = r; });

      function fail(msg) {
        els.err.textContent = msg;
        els.err.classList.add('show');
      }

      document.getElementById('save').addEventListener('click', function () {
        els.err.classList.remove('show');
        var v = (document.querySelector('input[name=mode]:checked') || {}).value;
        if (v === 'server') {
          resolveResult({ mode: 'server', share: els.share.checked });
          return;
        }
        var a = els.addr.value.trim().replace(/^https?:\/\//i, '').replace(/\/+$/, '');
        if (!a) return fail('Enter the address of the Main PC.');
        // Reject anything that isn't host or host:port — a stray path or
        // credentials here would end up in the URL the app navigates to.
        if (!/^[A-Za-z0-9.\-]+(:\d{1,5})?$/.test(a)) {
          return fail('That does not look like an address. Use something like 192.168.1.50');
        }
        resolveResult({ mode: 'client', address: a });
      });

      document.getElementById('cancel').addEventListener('click', function () {
        resolveResult(null);
      });

      els.addr.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') document.getElementById('save').click();
      });
    </script>
  </body>
</html>
